name: Moyo CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Lint & Build Monorepo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            apps/api/package.json
            apps/worker/package.json
            apps/web/package.json

      - name: Build & Check API
        run: |
          cd apps/api
          npm ci
          npx prisma generate
          npm run build

      - name: Build & Check Worker
        run: |
          cd apps/worker
          npm ci
          npx prisma generate
          npm run build

      - name: Build & Check Web PWA
        run: |
          cd apps/web
          npm ci
          npm run build -- --configuration production

  docker:
    name: Validate Docker Images Build
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/docker-buildx-action@v3

      - name: Build API Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/api
          file: ./apps/api/Dockerfile
          push: false
          tags: moyo-api:test

      - name: Build Worker Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/worker
          file: ./apps/worker/Dockerfile
          push: false
          tags: moyo-worker:test

      - name: Build Web Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/web
          file: ./apps/web/Dockerfile
          push: false
          tags: moyo-web:test

services:
  # ========================================================
  # Base de données PostgreSQL
  # ========================================================
  postgres:
    image: postgres:16-alpine
    container_name: moyo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-moyo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moyo_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-moyo_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-moyo_user} -d ${POSTGRES_DB:-moyo_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ========================================================
  # Cache & Files de traitement (BullMQ)
  # ========================================================
  redis:
    image: redis:7-alpine
    container_name: moyo-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ========================================================
  # Stockage Objets MinIO (Compatible S3)
  # ========================================================
  minio:
    image: minio/minio:RELEASE.2024-03-03T17-50-39Z
    container_name: moyo-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Initialisation automatique du bucket MinIO
  createbuckets:
    image: minio/mc:RELEASE.2024-03-03T17-50-39Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin};
      /usr/bin/mc mb --ignore-existing myminio/${S3_BUCKET_NAME:-moyo-media};
      /usr/bin/mc anonymous set download myminio/${S3_BUCKET_NAME:-moyo-media};
      exit 0;
      "

  # ========================================================
  # Serveur Ingest Live RTMP / HLS (Nginx RTMP)
  # ========================================================
  nginx-rtmp:
    image: alfg/nginx-rtmp:latest
    container_name: moyo-live-rtmp
    restart: unless-stopped
    ports:
      - "1935:1935" # Port d'ingestion RTMP (OBS, vMix, FFmpeg)
      - "8080:8080" # Port de distribution des flux directs HLS
    volumes:
      - ./docker/nginx-rtmp/nginx.conf:/etc/nginx/nginx.conf:ro
      - live_hls_data:/tmp/hls

  # ========================================================
  # Backend API NestJS
  # ========================================================
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: moyo-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-moyo_user}:${POSTGRES_PASSWORD:-moyo_secret_password}@postgres:5432/${POSTGRES_DB:-moyo_db}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      S3_ENDPOINT: minio
      S3_PORT: 9000
      S3_USE_SSL: "false"
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET_NAME:-moyo-media}
      S3_PUBLIC_URL: http://localhost:9000/${S3_BUCKET_NAME:-moyo-media}
      JWT_SECRET: ${JWT_SECRET:-moyo_super_secure_jwt_secret_key_2026_change_in_prod}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # ========================================================
  # Worker FFmpeg & Transcodage BullMQ
  # ========================================================
  worker:
    build:
      context: ./apps/worker
      dockerfile: Dockerfile
    container_name: moyo-worker
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-moyo_user}:${POSTGRES_PASSWORD:-moyo_secret_password}@postgres:5432/${POSTGRES_DB:-moyo_db}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${S3_BUCKET_NAME:-moyo-media}
      WORKER_CONCURRENCY: 2
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # ========================================================
  # Frontend Web Angular PWA
  # ========================================================
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: moyo-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  minio_data:
  live_hls_data:

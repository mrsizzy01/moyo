services:
  # ========================================================
  # Base de données PostgreSQL
  # ========================================================
  postgres:
    image: postgres:16-alpine
    container_name: moyo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-moyo_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-moyo_secret_password}
      POSTGRES_DB: ${POSTGRES_DB:-moyo_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-moyo_user} -d ${POSTGRES_DB:-moyo_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ========================================================
  # Cache & Files de traitement (BullMQ)
  # ========================================================
  redis:
    image: redis:7-alpine
    container_name: moyo-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ========================================================
  # Stockage Objets MinIO (Compatible S3)
  # ========================================================
  minio:
    image: minio/minio:RELEASE.2024-03-03T17-50-39Z
    container_name: moyo-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Initialisation automatique du bucket MinIO
  createbuckets:
    image: minio/mc:RELEASE.2024-03-03T17-50-39Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin};
      /usr/bin/mc mb --ignore-existing myminio/${S3_BUCKET_NAME:-moyo-media};
      /usr/bin/mc anonymous set download myminio/${S3_BUCKET_NAME:-moyo-media};
      exit 0;
      "

volumes:
  postgres_data:
  redis_data:
  minio_data:

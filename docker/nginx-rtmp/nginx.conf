worker_processes auto;
rtmp_auto_push on;
events {
    worker_connections 1024;
}

# ─── Configuration Serveur Ingestion RTMP ──────────────────────────────────────
rtmp {
    server {
        listen 1935;
        chunk_size 4096;

        # Application d'ingestion Live des créateurs (ex: rtmp://localhost:1935/live/<streamKey>)
        application live {
            live on;
            record off;

            # Génération de fragments HLS en direct
            hls on;
            hls_path /tmp/hls;
            hls_fragment 3s;
            hls_playlist_length 60s;
            hls_cleanup on;

            # Enregistrement optionnel des sessions pour le Replay automatique
            # record all;
            # record_path /tmp/recordings;
            # record_suffix -%d-%b-%y-%T.flv;
        }
    }
}

# ─── Distribution HTTP des flux HLS direct ────────────────────────────────────
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 8080;
        server_name localhost;

        # Distribution des playlists .m3u8 et segments .ts HLS
        location /hls {
            types {
                application/vnd.apple.mpegurl m3u8;
                video/mp2t ts;
            }
            root /tmp;
            
            # Entêtes CORS obligatoires pour les lecteurs HLS web
            add_header Cache-Control no-cache;
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods 'GET, OPTIONS' always;
            add_header Access-Control-Allow-Headers 'Range' always;
            add_header Access-Control-Expose-Headers 'Content-Length, Content-Range' always;

            if ($request_method = 'OPTIONS') {
                return 204;
            }
        }

        # Page de monitoring d'activité des flux en direct
        location /stat {
            rtmp_stat all;
            rtmp_stat_stylesheet stat.xsl;
        }

        location /stat.xsl {
            root /usr/share/nginx/html;
        }
    }
}
